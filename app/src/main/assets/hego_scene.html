<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Hego 3D AI Autonomous Companion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b1120;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #webgl-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1e293b 0%, #0b0f19 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #e2e8f0;
            z-index: 100;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(56, 189, 248, 0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #93c5fd;
        }
        .loading-sub {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 6px;
        }
        /* Standalone Web Floating UI */
        #web-voice-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: none; /* Only shown if running outside Android */
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 50;
            width: 90%;
            max-width: 400px;
        }
        .web-bubble {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 16px;
            padding: 12px 16px;
            color: white;
            font-size: 14px;
            text-align: center;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .web-mic-btn {
            background: linear-gradient(135deg, #2563eb, #38bdf8);
            border: none;
            outline: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.2s;
        }
        .web-mic-btn.listening {
            background: #ef4444;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="loading-screen">

    // --- COLLISION RESOLUTION FOR CHARACTER & OBJECTS ---
    function resolveCollision(currentPos, deltaMove, radius = 0.28) {
        let nextPos = currentPos.clone().add(deltaMove);

        // 1. Strict Wall Boundary Clamping
        nextPos.x = THREE.MathUtils.clamp(nextPos.x, ROOM_BOUNDS.minX + radius, ROOM_BOUNDS.maxX - radius);
        nextPos.z = THREE.MathUtils.clamp(nextPos.z, ROOM_BOUNDS.minZ + radius, ROOM_BOUNDS.maxZ - radius);

        // 2. Obstacle Sliding Collision
        for (const obs of OBSTACLES) {
            // Allow sitting at chair or bed without getting pushed away
            if (hego.isSitting && (obs.name === "chair" || obs.name === "bed")) continue;

            if (nextPos.x > obs.minX - radius && nextPos.x < obs.maxX + radius &&
                nextPos.z > obs.minZ - radius && nextPos.z < obs.maxZ + radius) {

                const tryX = currentPos.x + deltaMove.x;
                const hitX = (tryX > obs.minX - radius && tryX < obs.maxX + radius &&
                              currentPos.z > obs.minZ - radius && currentPos.z < obs.maxZ + radius);

                const tryZ = currentPos.z + deltaMove.z;
                const hitZ = (currentPos.x > obs.minX - radius && currentPos.x < obs.maxX + radius &&
                              tryZ > obs.minZ - radius && tryZ < obs.maxZ + radius);

                if (!hitX) {
                    nextPos.x = tryX;
                    nextPos.z = currentPos.z;
                } else if (!hitZ) {
                    nextPos.x = currentPos.x;
                    nextPos.z = tryZ;
                } else {
                    return currentPos.clone();
                }
            }
        }
        return nextPos;
    }

    // ==========================================
    // --- 2. SCENE INITIALIZATION & BUILDER ---
    // ==========================================
    function init() {
        const canvas = document.getElementById('webgl-canvas');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);
        scene.fog = new THREE.FogExp2(0x0f172a, 0.035);

        camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 100);

        renderer = new THREE.WebGLRenderer({
            canvas: canvas,
            antialias: true,
            powerPreference: "high-performance"
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.05;

        setupLighting();
        buildBedroom();
        buildVirtualCameraGadget();
        buildPhysicsBall();
        buildHegoCharacter();

        setCameraStationaryDesk(true);

        window.addEventListener('resize', onWindowResize, false);
        setupTouchInteraction(canvas);
        setupWebSpeechFallback();

        setTimeout(() => {
            const ls = document.getElementById('loading-screen');
            if (ls) {
                ls.style.opacity = '0';
                setTimeout(() => { ls.style.display = 'none'; }, 500);
            }
            isReady = true;
            if (window.HegoAndroidBridge && window.HegoAndroidBridge.onSceneReady) {
                window.HegoAndroidBridge.onSceneReady();
            }
        }, 800);

        animate();
    }

    // ==========================================
    // --- 3. PHYSICS BALL (THROWABLE PROP) ---
    // ==========================================
    function buildPhysicsBall() {
        const ballGeo = new THREE.SphereGeometry(ballPhysics.radius, 24, 24);
        const ballMat = new THREE.MeshStandardMaterial({
            color: 0xf97316, // Vibrant orange sports ball
            roughness: 0.3,
            metalness: 0.2,
            emissive: 0xea580c,
            emissiveIntensity: 0.15
        });

        physicsBallObj = new THREE.Mesh(ballGeo, ballMat);
        physicsBallObj.name = "PhysicsBall";
        physicsBallObj.castShadow = true;
        physicsBallObj.receiveShadow = true;
        physicsBallObj.position.copy(ballPhysics.pos);
        scene.add(physicsBallObj);
    }

    function updateBallPhysics(delta) {
        if (!physicsBallObj || ballPhysics.isHeld) return;

        if (ballPhysics.inAir) {
            // Gravity
            ballPhysics.vel.y += ballPhysics.gravity * delta;

            // Air drag
            ballPhysics.vel.x *= Math.pow(ballPhysics.friction, delta * 60);
            ballPhysics.vel.z *= Math.pow(ballPhysics.friction, delta * 60);

            // Step position
            ballPhysics.pos.x += ballPhysics.vel.x * delta;
            ballPhysics.pos.y += ballPhysics.vel.y * delta;
            ballPhysics.pos.z += ballPhysics.vel.z * delta;

            const r = ballPhysics.radius;

            // 1. Floor Bounce
            if (ballPhysics.pos.y <= r) {
                ballPhysics.pos.y = r;
                ballPhysics.vel.y = -ballPhysics.vel.y * ballPhysics.bounceRestitution;
                // Floor friction
                ballPhysics.vel.x *= 0.85;
                ballPhysics.vel.z *= 0.85;

                if (Math.abs(ballPhysics.vel.y) < 0.2) {
                    ballPhysics.vel.y = 0;
                    if (ballPhysics.vel.length() < 0.1) {
                        ballPhysics.inAir = false;
                        ballPhysics.vel.set(0, 0, 0);
                    }
                }
            }

            // 2. Desk Top Collision
            if (ballPhysics.pos.x >= -2.85 && ballPhysics.pos.x <= -1.25 &&
                ballPhysics.pos.z >= -0.4 && ballPhysics.pos.z <= 1.7) {
                const deskY = 1.05 + r;
                if (ballPhysics.pos.y <= deskY && ballPhysics.vel.y < 0 && ballPhysics.pos.y >= deskY - 0.2) {
                    ballPhysics.pos.y = deskY;
                    ballPhysics.vel.y = -ballPhysics.vel.y * ballPhysics.bounceRestitution;
                }
            }

            // 3. Wall Bounces (X)
            if (ballPhysics.pos.x <= ROOM_BOUNDS.minX + r) {
                ballPhysics.pos.x = ROOM_BOUNDS.minX + r;
                ballPhysics.vel.x = -ballPhysics.vel.x * ballPhysics.bounceRestitution;
            } else if (ballPhysics.pos.x >= ROOM_BOUNDS.maxX - r) {
                ballPhysics.pos.x = ROOM_BOUNDS.maxX - r;
                ballPhysics.vel.x = -ballPhysics.vel.x * ballPhysics.bounceRestitution;
            }

            // 4. Wall Bounces (Z)
            if (ballPhysics.pos.z <= ROOM_BOUNDS.minZ + r) {
                ballPhysics.pos.z = ROOM_BOUNDS.minZ + r;
                ballPhysics.vel.z = -ballPhysics.vel.z * ballPhysics.bounceRestitution;
            } else if (ballPhysics.pos.z >= ROOM_BOUNDS.maxZ - r) {
                ballPhysics.pos.z = ROOM_BOUNDS.maxZ - r;
                ballPhysics.vel.z = -ballPhysics.vel.z * ballPhysics.bounceRestitution;
            }

            // Ball rotation based on linear movement
            physicsBallObj.rotation.x += ballPhysics.vel.z * delta * 4;
            physicsBallObj.rotation.z -= ballPhysics.vel.x * delta * 4;
        }

        physicsBallObj.position.copy(ballPhysics.pos);
    }

    // ==========================================
    // --- 4. VIRTUAL CAMERA GADGET ---
    // ==========================================
    function buildVirtualCameraGadget() {
        deskCameraObj = new THREE.Group();

            new THREE.CylinderGeometry(0.08, 0.08, 0.06, 24),
            new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.3, metalness: 0.8 })
        );
        lensRing.rotation.x = Math.PI / 2;
        lensRing.position.z = 0.07;
        deskCameraObj.add(lensRing);

        const lensGlass = new THREE.Mesh(

        );

        );

        for (let i = 0; i < 3; i++) {

    // ==========================================
    // --- 6. CAMERA ATTACHMENT & CONTROLLER ---
    // ==========================================
    function setCameraStationaryDesk(instant = false) {
        currentCamState = "DESK_STAND";
        hego.hasCameraInHand = false;

        if (deskCameraObj) {
            scene.attach(deskCameraObj);
            deskCameraObj.position.copy(ROOM_LOCATIONS.deskStand);
            deskCameraObj.lookAt(hego.root.position.x, 1.15, hego.root.position.z);
            const tripod = deskCameraObj.getObjectByName("TripodStand");
            if (tripod) tripod.visible = true;
        }

        const deskCamPos = ROOM_LOCATIONS.deskStand.clone();
        cameraRig.targetPos.set(deskCamPos.x, deskCamPos.y + 0.03, deskCamPos.z);

        const lookTarget = new THREE.Vector3(hego.root.position.x, 1.15, hego.root.position.z);
        const tempCam = camera.clone();
        tempCam.position.copy(cameraRig.targetPos);
        tempCam.lookAt(lookTarget);
        cameraRig.targetQuat.copy(tempCam.quaternion);

        if (instant) {
            cameraRig.currentPos.copy(cameraRig.targetPos);
            cameraRig.currentQuat.copy(cameraRig.targetQuat);
            camera.position.copy(cameraRig.currentPos);
            camera.quaternion.copy(cameraRig.currentQuat);
        }

        notifyCameraState("DESK_STAND");
    }

    function attachCameraToHegoHand() {
        currentCamState = "HEGO_HAND_HELD";
        hego.hasCameraInHand = true;

        if (deskCameraObj && hegoHandSocket) {
            hegoHandSocket.attach(deskCameraObj);
            deskCameraObj.position.set(0, 0, 0);
            deskCameraObj.rotation.set(0, 0, 0);
            const tripod = deskCameraObj.getObjectByName("TripodStand");
            if (tripod) tripod.visible = false;
        }

        notifyCameraState("HEGO_HAND_HELD");
    }

    function notifyCameraState(state) {
        if (window.HegoAndroidBridge && window.HegoAndroidBridge.onCameraStateChanged) {
            window.HegoAndroidBridge.onCameraStateChanged(state);
        }
    }

    // ==========================================
    // --- 7. AUTONOMOUS ACTIONS & PHYSICS ---
    // ==========================================
    function executeHegoAction(actionName, targetObject, mood, actionForce = 5.0, speech = "") {
        console.log("Execute Hego Action:", actionName, "Target:", targetObject, "Force:", actionForce, "Mood:", mood);
        currentMood = mood || "happy";
        hego.currentAction = actionName;
        hego.actionTime = 0;

        // Stand up first if currently sitting
        if (hego.isSitting && actionName !== "SIT") {
            hego.isSitting = false;
            hego.pelvis.position.y = 0.75;
            hego.leftLeg.rotation.x = 0;
            hego.rightLeg.rotation.x = 0;
            hego.leftLowerLeg.rotation.x = 0;
            hego.rightLowerLeg.rotation.x = 0;
        }

        switch (actionName) {
            case "JUMP":
                // Real jumping with vertical velocity & gravity
                if (!hego.isJumping) {
                    hego.isJumping = true;
                    hego.velY = 4.2; // Leap upward
                    hego.leftLeg.rotation.x = -0.3;
                    hego.rightLeg.rotation.x = -0.3;
                }
                break;

            case "THROW":
                // Ball throwing physics
                handleBallThrowAction(actionForce, targetObject);
                break;

            case "SIT":
                handleSitAction(targetObject);
                break;

            case "HOLD_CAMERA":
            case "PICK_UP_CAMERA":
                walkTo(ROOM_LOCATIONS.desk, () => {
                    const dx = ROOM_LOCATIONS.deskStand.x - hego.root.position.x;
                    const dz = ROOM_LOCATIONS.deskStand.z - hego.root.position.z;
                    hego.targetRotY = Math.atan2(dx, dz);

                    hego.rightArm.rotation.set(-1.1, 0.4, -0.3);
                    setTimeout(() => {
                        attachCameraToHegoHand();
                        hego.rightArm.rotation.set(-1.4, -0.2, 0.2);
                        hego.rightForearm.rotation.set(-0.8, 0, 0);
                        setTimeout(() => { hego.targetRotY = 0; }, 600);
                    }, 500);
                });
                break;

            case "RESET_CAMERA":
            case "DROP_CAMERA":
            case "PUT_DOWN_CAMERA":
                if (!hego.hasCameraInHand) {
                    setCameraStationaryDesk();
                    return;
                }
                walkTo(ROOM_LOCATIONS.desk, () => {
                    hego.rightArm.rotation.set(-0.8, 0.3, 0);
                    setTimeout(() => {
                        setCameraStationaryDesk();
                        setTimeout(() => { walkTo(ROOM_LOCATIONS.center); }, 400);
                    }, 500);
                });
                break;

            case "PICK_UP":
                if (targetObject === "camera") {
                    executeHegoAction("HOLD_CAMERA", "camera", mood, actionForce);
                } else if (targetObject === "ball") {
                    handlePickUpBall();
                } else {
                    walkTo(ROOM_LOCATIONS.desk);
                }
                break;

            case "WALK_TO":
                const targetKey = (targetObject || "center").toLowerCase();
                const dest = ROOM_LOCATIONS[targetKey] || ROOM_LOCATIONS.center;
                walkTo(dest);
                break;

            case "LOOK_AROUND":
                if (!hego.hasCameraInHand) {
                    executeHegoAction("HOLD_CAMERA", "camera", mood);
                    setTimeout(() => {
                        hego.actionTime = 0;
                        hego.currentAction = "LOOK_AROUND";
                    }, 2200);
                } else {
                    hego.actionTime = 0;
                    hego.currentAction = "LOOK_AROUND";
                }
                break;

            case "WAVE":
                hego.leftArm.rotation.set(-2.2, 0, 0.5);
                break;

            case "IDLE":
            default:
                break;
        }

        // Web voice speak if speech is provided and not running inside Android
        if (speech && !window.HegoAndroidBridge) {
            speakWebTts(speech);
        }
    }

    function handleBallThrowAction(force, targetObject) {
        // If not holding ball, walk to ball, pick it up, then throw
        if (!ballPhysics.isHeld) {
            walkTo(ROOM_LOCATIONS.ball, () => {
                // Reach down to pick up ball
                hego.rightArm.rotation.set(-1.2, 0.3, 0);
                setTimeout(() => {
                    ballPhysics.isHeld = true;
                    ballPhysics.inAir = false;
                    hegoHandSocket.attach(physicsBallObj);
                    physicsBallObj.position.set(0, 0, 0);

                    // Turn toward room center to throw
                    hego.targetRotY = 0;
                    setTimeout(() => {
                        executeThrowRelease(force);
                    }, 600);
                }, 400);
            });
        } else {
            executeThrowRelease(force);
        }
    }

    function handlePickUpBall() {
        walkTo(ROOM_LOCATIONS.ball, () => {
            hego.rightArm.rotation.set(-1.2, 0.3, 0);
            setTimeout(() => {
                ballPhysics.isHeld = true;
                ballPhysics.inAir = false;
                hegoHandSocket.attach(physicsBallObj);
                physicsBallObj.position.set(0, 0, 0);
            }, 400);
        });
    }

    function executeThrowRelease(force) {
        // Wind-up arm backward
        hego.rightArm.rotation.set(-0.4, 0.5, 0.4);
        setTimeout(() => {
            // Vigorous forward throw swing
            hego.rightArm.rotation.set(-1.6, -0.2, -0.2);

            setTimeout(() => {
                // Detach ball from hand into world scene
                const worldPos = new THREE.Vector3();
                physicsBallObj.getWorldPosition(worldPos);

                scene.attach(physicsBallObj);
                ballPhysics.pos.copy(worldPos);
                physicsBallObj.position.copy(ballPhysics.pos);

                ballPhysics.isHeld = false;
                ballPhysics.inAir = true;

                // Calculate velocity based on force (1 to 10)
                const throwPower = THREE.MathUtils.clamp(force || 5.0, 1.0, 10.0) * 0.9;
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(hego.root.quaternion);

                ballPhysics.vel.set(
                    forward.x * throwPower + (Math.random() - 0.5) * 1.5,
                    3.5 + throwPower * 0.35, // Upward arc
                    forward.z * throwPower + (Math.random() - 0.5) * 1.5
                );

                // Arm follow through & settle
                setTimeout(() => {
                    hego.rightArm.rotation.set(0, 0, 0);
                }, 500);
            }, 180);
        }, 300);
    }

    function handleSitAction(target) {
        const isBed = target === "bed";
        const sitLocation = isBed ? ROOM_LOCATIONS.bed : ROOM_LOCATIONS.chair;

        walkTo(sitLocation, () => {
            // Face forward
            hego.targetRotY = isBed ? -Math.PI / 2 : Math.PI / 2;

            setTimeout(() => {
                hego.isSitting = true;
                const seatHeight = isBed ? 0.55 : 0.46;
                hego.pelvis.position.y = seatHeight;

                // Thighs 90 degrees forward, lower legs 90 degrees down
                hego.leftLeg.rotation.x = -Math.PI / 2;
                hego.rightLeg.rotation.x = -Math.PI / 2;
                hego.leftLowerLeg.rotation.x = Math.PI / 2;
                hego.rightLowerLeg.rotation.x = Math.PI / 2;

                // Arms resting gently on lap
                hego.leftArm.rotation.set(-0.6, 0.1, 0.2);
                hego.rightArm.rotation.set(-0.6, -0.1, -0.2);
            }, 300);
        });
    }

    function walkTo(targetPos, onComplete) {
        const clampedTarget = targetPos.clone();
        clampedTarget.x = THREE.MathUtils.clamp(clampedTarget.x, ROOM_BOUNDS.minX + 0.35, ROOM_BOUNDS.maxX - 0.35);
        clampedTarget.z = THREE.MathUtils.clamp(clampedTarget.z, ROOM_BOUNDS.minZ + 0.35, ROOM_BOUNDS.maxZ - 0.35);

        hego.targetPos.copy(clampedTarget);
        hego.isWalking = true;
        hego.onWalkComplete = onComplete;

        const dx = clampedTarget.x - hego.root.position.x;
        const dz = clampedTarget.z - hego.root.position.z;
        if (Math.abs(dx) > 0.05 || Math.abs(dz) > 0.05) {
            hego.targetRotY = Math.atan2(dx, dz);
        }
    }

    // ==========================================
    // --- 8. ANIMATION & RENDER LOOP ---
    // ==========================================
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);

        const delta = clock.getDelta();
        const time = clock.getElapsedTime();

        updateHego(delta, time);
        updateBallPhysics(delta);
        updateCameraPerspective(delta, time);

        renderer.render(scene, camera);
    }

    function updateHego(delta, time) {
        if (!hego.root) return;

        // 1. Jumping Physics (Gravity & Floor Grounding)
        if (hego.isJumping) {
            hego.velY += hego.gravity * delta;
            hego.posY += hego.velY * delta;

            if (hego.posY <= 0) {
                hego.posY = 0;
                hego.velY = 0;
                hego.isJumping = false;
                // Knee squash cushion
                hego.pelvis.position.y = 0.68;
                setTimeout(() => {
                    hego.pelvis.position.y = 0.75;
                    hego.leftLeg.rotation.x = 0;
                    hego.rightLeg.rotation.x = 0;
                }, 150);
            }
            hego.root.position.y = hego.posY;
        }

        // 2. Walking with Collision Detection
        if (hego.isWalking && !hego.isSitting) {
            hego.walkTime += delta * 7;
            const dist = hego.root.position.distanceTo(hego.targetPos);

            if (dist > 0.08) {
                const dir = hego.targetPos.clone().sub(hego.root.position).normalize();
                const deltaMove = dir.clone().multiplyScalar(delta * 1.5);
                const resolvedPos = resolveCollision(hego.root.position, deltaMove, 0.28);

                if (resolvedPos.distanceTo(hego.root.position) < 0.0005) {
                    hego.isWalking = false;
                    hego.leftLeg.rotation.x = 0;
                    hego.rightLeg.rotation.x = 0;
                    if (hego.onWalkComplete) {
                        const cb = hego.onWalkComplete;
                        hego.onWalkComplete = null;
                        cb();
                    }
                } else {
                    hego.root.position.x = resolvedPos.x;
                    hego.root.position.z = resolvedPos.z;
                    hego.root.rotation.y = THREE.MathUtils.lerp(hego.root.rotation.y, hego.targetRotY, 0.12);

                    hego.leftLeg.rotation.x = Math.sin(hego.walkTime) * 0.6;
                    hego.rightLeg.rotation.x = -Math.sin(hego.walkTime) * 0.6;
                    hego.pelvis.position.y = 0.75 + Math.abs(Math.sin(hego.walkTime * 2)) * 0.04;

                    if (!hego.hasCameraInHand && !ballPhysics.isHeld) {
                        hego.rightArm.rotation.x = Math.sin(hego.walkTime) * 0.4;
                    }
                    hego.leftArm.rotation.x = -Math.sin(hego.walkTime) * 0.4;
                }
            } else {
                hego.isWalking = false;
                hego.leftLeg.rotation.x = 0;
                hego.rightLeg.rotation.x = 0;
                hego.pelvis.position.y = 0.75;
                if (hego.onWalkComplete) {
                    const cb = hego.onWalkComplete;
                    hego.onWalkComplete = null;
                    cb();
                }
            }
        } else if (!hego.isSitting) {
            // Idle breathing
            hego.idleTime += delta * 2;
            const breath = Math.sin(hego.idleTime) * 0.025;
            hego.chest.position.y = 0.18 + breath;
            hego.head.position.y = 0.32 + breath * 0.5;

            if (currentMood === "thinking") {
                hego.head.rotation.z = 0.15;
                hego.head.rotation.x = -0.1;
            } else if (currentMood === "excited") {
                hego.head.rotation.set(0, Math.sin(time * 3) * 0.1, 0);
            } else {
                hego.head.rotation.z = Math.sin(time * 0.8) * 0.03;
            }

            // Wave gesture
            if (hego.currentAction === "WAVE") {
                hego.leftArm.rotation.z = 0.6 + Math.sin(time * 8) * 0.35;
                hego.leftArm.rotation.x = -2.0;
            } else if (!hego.isWalking) {
                hego.leftArm.rotation.x = THREE.MathUtils.lerp(hego.leftArm.rotation.x, 0.05, 0.1);
                hego.leftArm.rotation.z = THREE.MathUtils.lerp(hego.leftArm.rotation.z, -0.05, 0.1);
            }

            // Look Around (Room Sweep)
            if (hego.currentAction === "LOOK_AROUND" && hego.hasCameraInHand) {
                hego.actionTime += delta;
                hego.root.rotation.y = time * 0.6;
                hego.rightArm.rotation.set(-1.2, 0.4, -0.1);
                if (hego.actionTime > 6) {
                    hego.currentAction = "IDLE";
                }
            }
        }

        // 3. Eye Blinking
        hego.blinkTime += delta;
        if (hego.blinkTime > 3.5) {
            hego.leftEyelid.rotation.x = 0;
            hego.rightEyelid.rotation.x = 0;
            if (hego.blinkTime > 3.7) {
                hego.leftEyelid.rotation.x = -Math.PI / 2;
                hego.rightEyelid.rotation.x = -Math.PI / 2;
                hego.blinkTime = 0;
            }
        }

        // 4. Dynamic Lip-Sync Mouth Animation
        if (isSpeaking) {
            const mouthOpen = 0.3 + Math.abs(Math.sin(time * 16)) * 0.9;
            const mouthWidth = 1.0 + Math.sin(time * 10) * 0.3;
            hego.mouth.scale.set(mouthWidth, mouthOpen, 0.5);
            hego.head.rotation.x = Math.sin(time * 8) * 0.05;
        } else {
            hego.mouth.scale.set(1.2, 0.25, 0.4);
        }

        // 5. Holding Camera Pose
        if (hego.hasCameraInHand && hego.currentAction !== "LOOK_AROUND") {
            hego.rightArm.rotation.x = THREE.MathUtils.lerp(hego.rightArm.rotation.x, -1.35, 0.1);
            hego.rightArm.rotation.y = THREE.MathUtils.lerp(hego.rightArm.rotation.y, -0.3, 0.1);
            hego.rightArm.rotation.z = THREE.MathUtils.lerp(hego.rightArm.rotation.z, 0.2, 0.1);
            hego.rightForearm.rotation.x = THREE.MathUtils.lerp(hego.rightForearm.rotation.x, -0.7, 0.1);
        }
    }

    // ==========================================
    // --- 9. VIRTUAL CAMERA PERSPECTIVE SYNC ---
    // ==========================================
    function updateCameraPerspective(delta, time) {
        if (cameraMode === "FREE_ORBIT") {
            camera.position.set(
                Math.sin(time * 0.2) * 4.5,
                2.8,
                Math.cos(time * 0.2) * 4.5
            );
            camera.lookAt(hego.root.position.x, 1.2, hego.root.position.z);
            return;
        }

        if (currentCamState === "HEGO_HAND_HELD" && deskCameraObj) {
            const worldPos = new THREE.Vector3();
            deskCameraObj.getWorldPosition(worldPos);

            cameraRig.swayTime += delta * 1.5;
            const swayX = Math.sin(cameraRig.swayTime * 2.3) * 0.015;
            const swayY = Math.cos(cameraRig.swayTime * 1.8) * 0.015;

            cameraRig.targetPos.set(worldPos.x + swayX, worldPos.y + swayY, worldPos.z);

            if (hego.currentAction === "LOOK_AROUND") {
                const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(hego.root.quaternion);
                const lookAtPos = worldPos.clone().add(forward.multiplyScalar(3));
                const tempCam = camera.clone();
                tempCam.position.copy(cameraRig.targetPos);
                tempCam.lookAt(lookAtPos);
                cameraRig.targetQuat.copy(tempCam.quaternion);
            } else {
                const hegoHeadPos = new THREE.Vector3();
                hego.head.getWorldPosition(hegoHeadPos);

                const tempCam = camera.clone();
                tempCam.position.copy(cameraRig.targetPos);
                tempCam.lookAt(hegoHeadPos.x, hegoHeadPos.y - 0.05, hegoHeadPos.z);
                cameraRig.targetQuat.copy(tempCam.quaternion);
            }

            cameraRig.currentPos.lerp(cameraRig.targetPos, 0.15);
            cameraRig.currentQuat.slerp(cameraRig.targetQuat, 0.15);

            camera.position.copy(cameraRig.currentPos);
            camera.quaternion.copy(cameraRig.currentQuat);

        } else if (currentCamState === "DESK_STAND") {
            const deskCamPos = ROOM_LOCATIONS.deskStand;
            cameraRig.targetPos.set(deskCamPos.x + 0.05, deskCamPos.y + 0.05, deskCamPos.z);

            const hegoChestPos = new THREE.Vector3();
            hego.chest.getWorldPosition(hegoChestPos);

            const tempCam = camera.clone();
            tempCam.position.copy(cameraRig.targetPos);
            tempCam.lookAt(hegoChestPos.x, hegoChestPos.y + 0.1, hegoChestPos.z);
            cameraRig.targetQuat.copy(tempCam.quaternion);

            cameraRig.currentPos.lerp(cameraRig.targetPos, 0.08);
            cameraRig.currentQuat.slerp(cameraRig.targetQuat, 0.08);

            camera.position.copy(cameraRig.currentPos);
            camera.quaternion.copy(cameraRig.currentQuat);
        }
    }

    // Touch interaction
    function setupTouchInteraction(canvas) {
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        canvas.addEventListener('click', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            if (intersects.length > 0) {
                let clicked = intersects[0].object;
                while (clicked && clicked.parent && clicked !== scene) {
                    if (clicked.name === "Hego") {
                        executeHegoAction("WAVE", null, "happy");
                        if (window.HegoAndroidBridge && window.HegoAndroidBridge.onObjectClicked) {
                            window.HegoAndroidBridge.onObjectClicked("hego");
                        }
                        return;
                    }
                    if (clicked.name === "PhysicsBall") {
                        executeHegoAction("THROW", "ball", "playful", 7.0);
                        return;
                    }
                    if (clicked.name === "VirtualCamera") {
                        if (hego.hasCameraInHand) {
                            executeHegoAction("RESET_CAMERA", "camera", "happy");
                        } else {
                            executeHegoAction("HOLD_CAMERA", "camera", "excited");
                        }
                        return;
                    }
                    clicked = clicked.parent;
                }
            }
        });
    }

    // Web Speech Recognition & Web TTS Fallback (for browser usage outside Android)
    function setupWebSpeechFallback() {
        if (!window.HegoAndroidBridge) {
            const overlay = document.getElementById('web-voice-overlay');
            const micBtn = document.getElementById('web-mic');
            const dialogue = document.getElementById('web-dialogue');
            if (overlay) overlay.style.display = 'flex';

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition && micBtn) {
                const recognition = new SpeechRecognition();
                recognition.lang = 'uz-UZ';
                recognition.continuous = false;
                recognition.interimResults = false;

                recognition.onstart = () => {
                    micBtn.classList.add('listening');
                    dialogue.innerText = "Sizni tinglayapman...";
                };

                recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    dialogue.innerText = `Siz: "${transcript}"`;
                    // Dispatch speech action
                    if (transcript.toLowerCase().includes("sakra")) {
                        executeHegoAction("JUMP", null, "excited");
                    } else if (transcript.toLowerCase().includes("ot") || transcript.toLowerCase().includes("koptok")) {
                        executeHegoAction("THROW", "ball", "playful", 8.0);
                    } else if (transcript.toLowerCase().includes("o'tir") || transcript.toLowerCase().includes("otir")) {
                        executeHegoAction("SIT", "chair", "happy");
                    } else if (transcript.toLowerCase().includes("kamera")) {
                        executeHegoAction("HOLD_CAMERA", "camera", "happy");
                    } else {
                        executeHegoAction("WAVE", null, "happy");
                    }
                };

                recognition.onerror = () => {
                    micBtn.classList.remove('listening');
                };

                recognition.onend = () => {
                    micBtn.classList.remove('listening');
                };

                micBtn.onclick = () => {
                    recognition.start();
                };
            }
        }
    }

    function speakWebTts(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'uz-UZ';
            utterance.pitch = 1.25;
            utterance.rate = 1.0;
            utterance.onstart = () => { isSpeaking = true; };
            utterance.onend = () => { isSpeaking = false; };
            utterance.onerror = () => { isSpeaking = false; };
            window.speechSynthesis.speak(utterance);
        }
    }

    function onWindowResize() {
        if (!camera || !renderer) return;
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // --- EXTERNAL JAVASCRIPT API (Called from Kotlin Android WebView) ---
    window.hegoExecuteAction = function(action, targetObject, mood, force, speech) {
        executeHegoAction(action, targetObject, mood, force || 5.0, speech || "");
    };

    window.hegoSetSpeaking = function(speaking) {
        isSpeaking = !!speaking;
    };

    window.hegoSetCameraMode = function(mode) {
        cameraMode = mode;
    };

    window.hegoSetMood = function(mood) {
        currentMood = mood;
    };

    window.onload = init;
    </script>
